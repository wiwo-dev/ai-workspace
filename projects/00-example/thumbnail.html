<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; font-family: "Archivo Black", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 45%); }
  h1 { position: absolute; top: 220px; left: 80px; right: 80px; margin: 0;
       font-size: 130px; line-height: .95; color: #fff; text-transform: uppercase; letter-spacing: -2px; }
  h1 em { font-style: normal; color: #f2c14e; }
</style>
</head>
<body>
  <img class="bg" src="frames/frame-03.jpg" alt="">
  <div class="shade"></div>
  <h1>My first <em>agent</em> thumbnail</h1>
</body>
</html>
